version: "2"

# Strictest configuration: every linter golangci-lint v2 ships ("all" default
# set) stays enabled, with a minimal set of documented, justified settings and
# exclusions. The only wholesale disables are the deprecated names below,
# whose active replacements remain enabled through the "all" set.

linters:
  default: all
  disable:
    # Deprecated linters whose replacements stay enabled via "all" above.
    # Disabling only the deprecated names keeps the gate's output free of
    # deprecation warnings; the checks themselves keep running:
    #   wsl        -> wsl_v5        (enabled, at zero)
    #   exhaustruct -> exhaustruct_v5 (enabled, at zero)
    #   gomodguard  -> gomodguard_v2  (enabled, no findings)
    - wsl
    - exhaustruct
    - gomodguard

  settings:
    cyclop:
      # Existing functions measure 11-14 (observed maximum: 14). Decomposing the
      # live proxy's connection flows during a zero-behavior-change lint pass
      # would carry regression risk out of proportion to the gain, so the limit
      # is pinned at 15 to catch new regressions instead.
      max-complexity: 15
    funlen:
      # Observed maxima: 77 lines / 58 statements, driven by deliberately
      # sequential protocol and CLI flows whose complexity is bounded by
      # cyclop and gocognit. Thresholds sit just above the observed values.
      lines: 80
      statements: 60
    nestif:
      # Observed maximum nested-block complexity: 11, in the legacy proxy
      # state-machine functions. Same rationale as cyclop: decomposing live
      # connection flows is out of scope for a zero-behavior-change pass.
      min-complexity: 12
    depguard:
      rules:
        Main:
          # depguard's built-in default (stdlib only) denies this module's own
          # declared dependencies, including the root package itself. The
          # allowlist mirrors go.mod exactly; everything else is rejected.
          allow:
            - $gostd
            - firefox-vpn-client
            - github.com/quic-go/quic-go
            - golang.org/x/crypto
            - golang.org/x/net
            - golang.org/x/term
    exhaustruct_v5:
      # Stdlib and third-party option structs are designed for partial
      # initialization; enumerating dozens of zero-value fields there is noise,
      # not safety. First-party structs stay fully checked.
      ignore-patterns:
        - '^net/http\.Client$'
        - '^net/http\.Transport$'
        - '^crypto/tls\.Config$'
        - '^net\.Dialer$'
        - '^net\.UDPAddr$'
        - '^golang\.org/x/net/http2\.Transport$'
        - '^github\.com/quic-go/quic-go\.Config$'
        - '^github\.com/quic-go/quic-go/http3\.Transport$'
    tagliatelle:
      case:
        rules:
          # The FxA, Guardian, and Remote Settings wire format is snake_case
          # (access_token, refresh_token, expires_in, ...). Renaming JSON tags
          # to camelCase would break the protocol, so snake_case is the rule.
          json: snake

  exclusions:
    rules:
      # Test fixtures intentionally use partial struct initialization;
      # exhaustive zero-value field lists in fakes hurt readability.
      - path: _test\.go
        linters:
          - exhaustruct_v5
      # Tests construct ad-hoc errors as inputs to production error paths;
      # the static-sentinel/wrapping taxonomy applies to production code.
      - path: _test\.go
        linters:
          - err113
          - wrapcheck
      # These tests exercise unexported API directly, so moving them to an
      # external _test package is impossible.
      - path: (fastly|fastly_e2e|fxa|guardian|tokens)_test\.go
        linters:
          - testpackage
      # guardian_test.go deliberately swaps time.Local to a fixed CST zone to
      # cover the local-wall-clock claim-time correction, so it both uses
      # time.Local and cannot run in parallel.
      - path: guardian_test\.go
        linters:
          - gosmopolitan
          - paralleltest
      # The CLI's stdout printing is its user interface, not debug residue;
      # forbidigo's default patterns target debug prints in library code.
      # Covers the proxy-demo flag usage/progress output and the root
      # package's server-list printer.
      - path: (cmd/proxy-demo/main|serverlist)\.go
        linters:
          - forbidigo

issues:
  # Zero both limits: the defaults (50 per linter, 3 identical) silently cap
  # output and hide real findings from the gate.
  max-issues-per-linter: 0
  max-same-issues: 0
